[project]
name = "reconcile-core"
version = "0.1.0"
description = "ETL pipeline to reconcile fragmented social identities into Google Contacts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["rich>=15.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconcile_core"]

[tool.hatch.build]
include = ["src/reconcile_core/**"]

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.16.8"]

[tool.ruff.lint]
# Explicit, version-stable rule set (the long-standing ruff defaults) so a
# ruff upgrade cannot silently change what CI enforces.
select = ["E4", "E7", "E9", "F"]
